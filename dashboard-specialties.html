<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de especialidades</title>
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/dashboard_style.css">
  <script defer src="scripts/dashboard.js"></script>
</head>
<body>
  <div class="dashboard-container">
    <header>
      <span>Gestor de turnos</span>
      <div>
        <button class="menu" id="menu-btn">&#9776;</button>
        <button id="logout">Cerrar Sesión</button>
      </div>
    </header>
    <nav id="sidebar">
      <ul>
        <li><a href="#">Panel</a></li>
      </ul>
    </nav>
    <main>
      <h1>Especialidades</h1>
      <div class="search-section">
        <form id="form-sp-name">
            <label for="specialty-name">Especialidad: </label>
            <div class="search-bar">
              <input id="specialty-input" type="text" name="specialty-name">
               <!--boton borrado-->
            </div>
            <button id="btn-buscar" type="submit">Buscar</button>
        </form>
      </div id=divperuano>
      <table class="specialty-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Descripción</th>
          </tr>
        </thead>
        <tbody id="specialty-table-body">
          
        </tbody>
      </table>
    </main>
    <footer>Centro de atención médica Sanatología y Otras ciencias &copy; 2032</footer>
  </div>
</body>
</html>
