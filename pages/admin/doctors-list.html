<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Doctores</title>
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/pages/admin-global.css">
  
  <link rel="stylesheet" href="/styles/components/sidebar.css">
  <link rel="stylesheet" href="/styles/components/search-section.css">
  <link rel="stylesheet" href="/styles/components/doctors-table.css">
  <link rel="stylesheet" href="/styles/components/cards.css">
  
  <script defer src="/scripts/admin-global.js"></script>
  <script defer src="/scripts/components/sidebar.js"></script>
  <script defer src="/scripts/services/doctors-service.js"></script>
  <script defer src="/scripts/pages/doctors-list.js"></script>
</head>
<body>
  <div class="dashboard-container">
    <header>
      <span>Gestor de turnos</span>
      <div>
        <button class="menu" id="menu-btn">&#9776;</button>
      </div>
    </header>
    <nav id="sidebar">
    </nav>
    <main>
      <h1><strong> Directorio de Doctores</strong></h1>

      <!--Sección de búsqueda-->
      <section class="search-section">
        <div class="search-section-header">
          <p>Gestione el pesonal medico y supervise su
             disponibilidad actual
          </p>
        </div>
        <form id="form-doc-name">
            <div class="search-bar">
              <input id="doctor-input" 
              type="text" 
              name="doctor-name"
              placeholder="Buscar doctor por nombre...">
              <!--boton borrado <- esta fue idea del profe-->
              <!--ícono de la lupita-->
            </div>
          </form>
          <a href="/pages/admin/doctors-create.html">
            <button type="button" id="btn-new-doctor">Nuevo<br>Doctor</button>
          </a>
      </section>

      <!--Tabla de doctores-->
      <table class="doctor-table">
        <thead>
          <tr>
            <th>Nombre del<br>doctor</th>
            <th>Especialidad</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="doctor-table-body">
          
        </tbody>
      </table>

      <!--Cards abajo de la tabla-->
      <section class="doctor-info-cards">
        <div class="info-card">
          <header class="card-header">
            <span class="card-title">TOTAL CONSULTAS HOY</span>
            <span class="card-icon">
              <img src="/icons/list.png" alt="list-icon">
            </span>
          </header>
          <!--Acá iría el número de especialidades calculado, por ahora será un placeholder-->
          <div class="card-value">148</div>
          <!--Acá iría el dato de cuantas se agregaron durante el trimestre-->
          <div class="card-extra-info">+12% desde ayer</div>
        </div>

        <div class="info-card">
        <header class="card-header">
          <span class="card-title">DISPONIBLES</span>
          <span class="card-icon">
            <img src="/icons/heart.png" alt="icono corazon">
          </span>
        </header>
        <div class="card-value">92</div>
        <div class="card-extra-info"></div>
        </div>

        <div class="info-card">
          <header class="card-header">
          <span class="card-title">EMERGENCIAS</span>
          <span class="card-icon">
            <img src="/icons/verified.png" alt="icono verificado">
          </span>
        </header>
        <div class="card-value">3</div>
        <div class="card-extra-info"></div>
        </div>
      </section>

    </main>
    <footer>Centro de atención médica Sanatología y Otras ciencias &copy; 2032</footer>
  </div>
</body>
</html>
